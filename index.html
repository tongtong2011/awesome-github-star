<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星标淘金图鉴 · 我真正在用的 GitHub 仓库</title>
<style>
  :root{
    --bg:#0D1117; --panel:#161B22; --border:#30363D; --text:#E6EDF3;
    --muted:#8B949E; --accent:#58A6FF; --green:#3FB950; --gold:#D29922;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;line-height:1.6}
  .wrap{max-width:1200px;margin:0 auto;padding:32px 20px 60px}
  header{text-align:center;margin-bottom:24px}
  header h1{font-size:26px;font-weight:700}
  header p{color:var(--muted);font-size:14px;margin-top:6px}
  header a{color:var(--accent)}
  .toolbar{position:sticky;top:0;z-index:10;background:rgba(13,17,23,.95);backdrop-filter:blur(6px);padding:12px 0;border-bottom:1px solid var(--border);margin-bottom:24px}
  .search{width:100%;max-width:640px;display:block;margin:0 auto 12px;padding:9px 16px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:14px;outline:none}
  .search:focus{border-color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .chip{padding:4px 12px;border-radius:999px;border:1px solid var(--border);background:var(--panel);color:var(--muted);font-size:13px;cursor:pointer;transition:.15s}
  .chip:hover{color:var(--text);border-color:var(--accent)}
  .chip.active{background:var(--accent);border-color:var(--accent);color:#0D1117;font-weight:600}
  section{margin-bottom:36px}
  .sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .sec-head h2{font-size:19px}
  .sec-head .count{color:var(--muted);font-size:13px}
  .sec-desc{color:var(--muted);font-size:13px;margin-bottom:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
  .card{display:block;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;text-decoration:none;color:var(--text);transition:.15s}
  .card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .card .name{font-weight:600;font-size:14.5px;color:var(--accent);word-break:break-all}
  .card .desc{font-size:12.5px;color:var(--muted);margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .meta{display:flex;gap:14px;margin-top:9px;font-size:12px;color:var(--muted);align-items:center}
  .card .meta .stars{color:var(--gold)}
  .lang-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:-1px}
  .hidden{display:none!important}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="h1">⭐ 星标淘金图鉴</h1>
    <p id="subtitle">数据加载中…</p>
  </header>

  <div class="toolbar">
    <input class="search" id="search" type="text" placeholder="🔍 搜索仓库名或关键词…">
    <div class="chips" id="chips"></div>
  </div>

  <div id="content"></div>
  <footer>点击卡片跳转 GitHub · 按 Stars 降序排列 · 数据每日由 GitHub Actions 自动更新</footer>
</div>

<script src="data.js"></script>
<script>
const D = window.NAV_DATA;
const LANG_COLORS={"Python":"#3572A5","TypeScript":"#3178C6","JavaScript":"#F1E05A","Java":"#B07219","Go":"#00ADD8","Rust":"#DEA584","C":"#555555","C#":"#178600","Vue":"#41B883","Dart":"#00B4AB","HTML":"#E34C26","CSS":"#563D7C","PHP":"#4F5D95","Shell":"#89E051","Kotlin":"#A97BFF","Roff":"#ECDEBE","-":"#8B949E","Jupyter Notebook":"#DA5B0B"};

function fmt(n){return n>=1000?(n/1000).toFixed(1).replace(/\.0$/,"")+"k":""+n}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function card(r){
  const color=LANG_COLORS[r.l]||"#8B949E";
  const url="https://github.com/"+r.n;
  return `<a class="card" href="${url}" target="_blank" data-t="${esc(r.n+" "+r.d).toLowerCase()}">
    <div class="name">${r.n}</div><div class="desc">${esc(r.d||"")}</div>
    <div class="meta"><span class="stars">★ ${fmt(r.s)}</span><span><span class="lang-dot" style="background:${color}"></span>${r.l}</span></div></a>`;
}

let totalRepos=0, totalStars=0;
D.cats.forEach(c=>{totalRepos+=c.repos.length; c.repos.forEach(r=>totalStars+=r.s);});
const n10k=D.cats.reduce((a,c)=>a+c.repos.filter(r=>r.s>=10000).length,0);

document.getElementById("h1").textContent=`⭐ 星标淘金图鉴：${(totalStars/10000).toFixed(0)} 万星淘金记录`;
document.getElementById("subtitle").innerHTML=
  `${totalRepos} 个我真正在用的 GitHub 仓库 · ${D.cats.length} 大分类 · ${n10k} 个万星项目 · 数据更新于 ${D.updated} · <a href="https://github.com/tongtong2011/awesome-github-star" target="_blank">★ awesome-github-star</a>`;

const content=document.getElementById("content"), chips=document.getElementById("chips");
content.innerHTML=D.cats.map(c=>`
  <section id="${c.id}" data-cat="${c.id}">
    <div class="sec-head"><h2>${c.icon} ${c.name}</h2><span class="count">${c.repos.length} 个</span></div>
    <div class="sec-desc">${esc(c.desc)}</div>
    <div class="grid">${c.repos.map(card).join("")}</div></section>`).join("");
chips.innerHTML=`<span class="chip active" data-c="all">全部 ${totalRepos}</span>`+D.cats.map(c=>`<span class="chip" data-c="${c.id}">${c.icon} ${c.name} ${c.repos.length}</span>`).join("");
chips.addEventListener("click",e=>{
  const chip=e.target.closest(".chip"); if(!chip)return;
  document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active")); chip.classList.add("active");
  const cat=chip.dataset.c;
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("hidden",cat!=="all"&&s.dataset.cat!==cat));
});
document.getElementById("search").addEventListener("input",e=>{
  const q=e.target.value.trim().toLowerCase();
  document.querySelectorAll(".card").forEach(c=>c.classList.toggle("hidden",q&&!c.dataset.t.includes(q)));
  document.querySelectorAll("section").forEach(s=>{
    const visible=[...s.querySelectorAll(".card:not(.hidden)")].length;
    s.classList.toggle("hidden",visible===0&&!!q);
  });
});
</script>
</body>
</html>
