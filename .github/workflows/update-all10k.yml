name: Update all-10000-star (fetch-free snapshot refresh + translate)

on:
  workflow_dispatch: # 手动触发
  schedule:
    - cron: "0 3 * * 6" # 每周六 03:00 UTC（北京时间 11:00）自动刷新

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate with Chinese translations
        env:
          TRANSLATE: "1"
        run: python scripts/update_all10k.py snapshot

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add all-10000-star/README.md all-10000-star/data.js all-10000-star/snapshot.json
          git diff --cached --quiet && echo "No changes" || git commit -m "chore(all-10000-star): refresh snapshot + Chinese translations [skip ci]"
          git push
